<title>ASCEND – Fitness Training Arc</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a14;--pn:#12152a;--ln:#2a3160;--tx:#e8ecff;--mu:#8c94c4;--cy:#ff9a2e;--au:#ffe14a;--rd:#ff3d6e;--gr:#3dffa0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#1b2a6b55,transparent),var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.hd{font-family:'Chakra Petch',system-ui,sans-serif;letter-spacing:.02em;margin:0}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 14px;background:#090a14ee;border-bottom:1px solid var(--ln)}
#burger{width:44px;height:44px;border:1px solid var(--cy);background:#ff9a2e14;border-radius:10px;cursor:pointer;display:grid;place-content:center;gap:5px;box-shadow:0 0 14px #ff9a2e44}
#burger i{display:block;width:20px;height:2px;background:var(--cy)}
#brand{font-size:20px;font-weight:700;color:var(--cy)}#mini{margin-left:auto;font-size:13px;color:var(--mu)}
#side{position:fixed;top:0;left:0;bottom:0;width:250px;z-index:30;background:#0d1024;border-right:1px solid var(--cy);transform:translateX(-105%);transition:transform .3s;padding:70px 10px 20px;overflow:auto;box-shadow:0 0 40px #ff9a2e33}
#side.open{transform:none}
#side button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:11px 14px;border-radius:8px;font:700 15px 'Chakra Petch',sans-serif;cursor:pointer;border-left:3px solid transparent}
#side button:hover,#side button.on{background:#ff9a2e18;border-color:var(--cy);color:var(--cy)}
#veil{position:fixed;inset:0;background:#000a;z-index:25;display:none}#veil.on{display:block}
main{max-width:1040px;margin:0 auto;padding:18px 14px 60px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:linear-gradient(160deg,#171b38,var(--pn));border:1px solid var(--ln);border-radius:14px;padding:16px;position:relative;box-shadow:inset 0 0 30px #ff9a2e0a}
.card.glow{border-color:var(--cy);box-shadow:0 0 22px #ff9a2e33,inset 0 0 30px #ff9a2e10}
h2{font-size:26px;margin-bottom:14px}h3{font-size:17px;margin-bottom:8px}
.bar{height:12px;background:#0b0d1c;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,#ff5a00,var(--cy));box-shadow:0 0 12px var(--cy);transition:width .6s}
.bar.au b{background:linear-gradient(90deg,#ff7a1a,var(--au));box-shadow:0 0 12px var(--au)}
.bar.rd b{background:linear-gradient(90deg,#b0164a,var(--rd));box-shadow:0 0 12px var(--rd)}
.bar.gr b{background:linear-gradient(90deg,#0aa060,var(--gr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:13px}.tag{font:700 12px 'Chakra Petch';color:var(--au);border:1px solid var(--au);border-radius:6px;padding:1px 7px;letter-spacing:.05em}
.av{width:84px;height:84px;border-radius:50%;border:2px solid var(--cy);display:grid;place-content:center;font:700 34px 'Chakra Petch';background:radial-gradient(circle,#ff9a2e44,#12152a);box-shadow:0 0 24px var(--cy);animation:pulse 3s infinite}
@keyframes pulse{50%{box-shadow:0 0 40px var(--cy)}}
button.b,.b{background:linear-gradient(180deg,#1f7bff,#1450c8);color:#fff;border:0;border-radius:9px;padding:9px 16px;font:700 14px 'Chakra Petch';cursor:pointer;box-shadow:0 0 14px #1f7bff66}
.b.au{background:linear-gradient(180deg,#ffb62e,#e0741a);color:#1a1000;box-shadow:0 0 14px #ffb62e66}.b.g{background:#ffffff10;box-shadow:none;border:1px solid var(--ln)}.b.on{border-color:var(--cy);color:var(--cy)}
.b:focus-visible,#burger:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--au);outline-offset:2px}
input,select{background:#0b0d1c;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font:inherit;max-width:100%}
input.n{width:66px}.x{background:none;border:0;color:var(--rd);cursor:pointer;font-size:16px}
.lock{opacity:.35;filter:grayscale(1)}.unl{animation:shine 2.5s infinite}@keyframes shine{50%{box-shadow:0 0 22px var(--au);border-color:var(--au)}}
label{display:grid;gap:3px;font-size:13px;color:var(--mu)}.stat{margin-bottom:12px}.stat .row{margin-bottom:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal div{aspect-ratio:1;border-radius:8px;border:1px solid var(--ln);display:grid;place-content:center;font-size:13px;cursor:pointer;background:#0b0d1c}
.cal .t{background:#3dffa022;border-color:var(--gr);color:var(--gr)}.cal .t2{background:#ffb62e22;border-color:var(--au);color:var(--au)}.cal .h{border:0;background:none;cursor:default;color:var(--mu)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:left}
#fx{position:fixed;inset:0;z-index:60;display:none;place-content:center;text-align:center;background:radial-gradient(circle,#ff9a2e33,#050610f2 70%);cursor:pointer}
#fx.on{display:grid}#fx .in{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
#fx h1{font-size:clamp(40px,12vw,90px);color:var(--au);text-shadow:0 0 30px var(--au),0 0 60px var(--rd)}#fx p{font-size:22px;margin:6px 0}
#toasts{position:fixed;right:12px;bottom:12px;z-index:50;display:grid;gap:8px}.toast{background:var(--pn);border:1px solid var(--cy);border-radius:10px;padding:10px 14px;animation:pop .4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){h2{font-size:22px}#mini{display:none}#chip{margin-left:auto}}
</style></head><body>

/* Food API adapter: front end only ever calls /api/foods. Server route holds the secret (process.env.FOOD_API_KEY). Falls back to mock data. */
const FoodAPI={async search(q){try{const k=S.foodApiKey||'DEMO_KEY',r=await fetch(`https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(k)}&pageSize=10&query=${encodeURIComponent(q)}`);if(r.ok){const d=await r.json();if(d.foods&&d.foods.length){const nv=(f,id)=>{const n=(f.foodNutrients||[]).find(x=>x.nutrientId==id);return n?n.value:0};return d.foods.map(f=>[f.description,f.brandOwner||f.dataType||'USDA',f.servingSize?`${f.servingSize} ${f.servingSizeUnit||'g'}`:'100 g',Math.round(nv(f,1008)),Math.round(nv(f,1003)*10)/10,Math.round(nv(f,1005)*10)/10,Math.round(nv(f,1004)*10)/10])}}}catch(e){}return FOODS.filter(f=>f[0].toLowerCase().includes(q.toLowerCase())||f[1].toLowerCase().includes(q.toLowerCase()))}};

V.Nutrition=()=>{const t=mt(),dt=day(),fd=FD(dt);return `<h2>Nutrition</h2><div class="grid"><div class="card glow"><h3>Daily Calories</h3><b class="hd" style="font-size:24px">${t[0].toLocaleString()} / ${GL().cal.toLocaleString()}</b>${bar(t[0],GL().cal,'au')}<p class="row sp"><span>Protein ${Math.round(t[1])}g / ${GL().p}g</span></p>${bar(t[1],GL().p)}<p>Carbs ${Math.round(t[2])}g / ${GL().c}g</p>${bar(t[2],GL().c,'gr')}<p>Fat ${Math.round(t[3])}g / ${GL().f}g</p>${bar(t[3],GL().f,'rd')}</div>
<div class="card"><h3>Search Food</h3><div class="row"><input id="fq" placeholder="Search for food..." value="chicken" onkeydown="if(event.key=='Enter')fs()"><button class="b" onclick="fs()">Search</button></div><div id="fr">${fr()}</div></div></div>
<div class="grid" style="margin-top:14px">${Object.entries(fd).map(([m,l])=>`<div class="card"><h3>${m.toUpperCase()}</h3>${l.map((f,i)=>`<div class="row sp"><span>${f[0]}</span><span class="mu">${f[1]} cal <button class="x" onclick="FD('${dt}')['${m}'].splice(${i},1);go('Nutrition')" aria-label="Delete">✕</button></span></div>`).join('')||'<p class="mu">Nothing logged yet.</p>'}<hr style="border-color:var(--ln)"><b>TOTAL ${l.reduce((a,f)=>a+f[1],0)} calories</b></div>`).join('')}</div>`};
const fr=()=>res.map((f,i)=>`<div class="row sp" style="margin-top:10px;border-bottom:1px solid var(--ln);padding-bottom:8px"><div><b>${f[0]}</b> <span class="mu">${f[1]} • ${f[2]}</span><div class="mu">${f[3]} cal • P${f[4]} C${f[5]} F${f[6]}</div></div><div class="row"><select id="m${i}"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snacks</option></select><input class="n" id="q${i}" type="number" min=".5" step=".5" value="1" aria-label="Quantity"><button class="b" onclick="addF(${i})">Add</button></div></div>`).join('');
async function fs(){res=await FoodAPI.search($('#fq').value);$('#fr').innerHTML=fr()||'<p class="mu">No matches. Try another food.</p>'}
function addF(i){const f=res[i],q=+$('#q'+i).value||1;FD()[$('#m'+i).value].push([`${f[0]} ×${q}`,Math.round(f[3]*q),f[4]*q,f[5]*q,f[6]*q]);progress('n',0);go('Nutrition')}
V.Leaderboard=()=>{const cats=['Weekly XP','Monthly XP','Total XP','Workout Streak','Most Workouts','Power Level','Stamina'],c=S.lb||'Weekly XP',k=cats.indexOf(c)+2;const P=[['Player123','Iron Will',42,'Celestial'],['Player456','Power Seeker',39,'Demon'],['Nova',"Limit Breaker",35,'Android'],[S.name,S.title,S.lvl,S.race],['Rin','Unbreakable',24,'Alien'],['Vex','Rising Warrior',22,'Beast']];
 const rows=P.map((p,i)=>({p,v:i==3?[S.total.xp,S.total.xp,S.total.xp,S.streak,S.total.workouts,PL(),Math.round(S.stats.Stamina)][k-2]:Math.round((90-i*9+(i*k*13)%17)*(k<5?140:1.1))})).sort((a,b)=>b.v-a.v);
 return `<h2>World Martial Arts Tournament</h2><div class="row" style="margin-bottom:12px">${cats.map(x=>`<button class="b g ${x==c?'on':''}" onclick="S.lb='${x}';go('Leaderboard')">${x}</button>`).join('')}</div><div class="grid">${rows.map((r,i)=>`<div class="card ${r.p[0]==S.name?'glow':''}"><div class="row sp"><b class="hd" style="font-size:26px;color:${i?'var(--mu)':'var(--au)'}">#${i+1}</b><b class="hd">${r.v.toLocaleString()}</b></div><span class="tag">${r.p[1].toUpperCase()}</span> <b>${r.p[0]}</b><div class="mu">Level ${r.p[2]} • ${r.p[3]}</div></div>`).join('')}</div>`};
V.Achievements=()=>`<h2>Achievements</h2><div class="card" style="margin-bottom:14px"><h3>Power Orbs ${S.orbs}/7</h3><div class="row">${[...Array(7)].map((_,i)=>`<span style="width:34px;height:34px;border-radius:50%;border:1px solid var(--cy);display:grid;place-content:center;font-size:12px;background:${i<S.orbs?'radial-gradient(#ffd27a,#ff7a00)':'#0b0d1c'};color:${i<S.orbs?'#300':'var(--mu)'}">${i+1}★</span>`).join('')}</div><p class="mu">Finish weekly and long-term quests to collect orbs. Gather all 7 to summon the dragon.</p></div><div class="grid">${S.ach.map((a,i)=>`<div class="card ${S.achOn[i]?'unl':'lock'}"><h3>${S.achOn[i]?'🏆':'🔒'} ${a}</h3><span class="mu">${S.achOn[i]?'Unlocked':'Locked'}</span></div>`).join('')}</div>`;
V.Titles=()=>`<h2>Titles</h2><p class="mu">Title tokens: ${S.tokens}. Equip one to show it beside your name.</p><div class="grid">${TITLES.map((t,i)=>`<div class="card ${S.owned[i]?'':'lock'}"><span class="tag">${t[0].toUpperCase()}</span><p class="mu">${t[1]}</p>${S.owned[i]?`<button class="b ${S.title==t[0]?'au':''}" onclick="S.title='${t[0]}';go('Titles')">${S.title==t[0]?'Equipped':'Equip'}</button>`:S.tokens?`<button class="b g" onclick="S.owned[${i}]=1;S.tokens--;go('Titles')">Unlock (1 token)</button>`:''}</div>`).join('')}</div>`;
V.Profile=()=>`<h2>Profile</h2><div class="card glow" style="border-top:6px solid ${S.banner}"><div class="row"><div class="av" style="--cy:${form()[2]}">${S.name[0]}</div><div><h3>${ttl()} ${S.name}</h3><div class="mu">Level ${S.lvl} • ${form()[1]} • ${S.streak}-day streak (best ${S.longest})</div></div></div>${pf()}<label style="margin-top:10px">Banner color <input type="color" value="${S.banner}" onchange="S.banner=this.value;go('Profile')"></label><h3 style="margin-top:14px">Recent history</h3><p class="mu">${S.hist.slice(-5).reverse().map(h=>`${h.date} • ${h.name} • ${h.mins} min`).join('<br>')||'No workouts yet.'}</p></div>`;
V.Setup=()=>`<h2>Create your fighter</h2><div class="card glow"><p class="mu">Tell us about you so your targets fit your goals. You can change everything later in Profile.</p>${pf()}<p><button class="b au" onclick="S.setup=1;if(S.prof.cal==2400&&S.prof.protein==160)suggest();fx('YOUR ARC BEGINS','Level 1 • Power Level '+PL(),'Start your first workout session');go('Dashboard')">Begin training</button></p></div>`;
V.Settings=()=>`<h2>Settings</h2><div class="grid"><div class="card"><h3>Sound effects</h3><button class="b ${S.sound?'au':'g'}" onclick="S.sound=!S.sound;go('Settings')">${S.sound?'On':'Off'}</button><p class="mu">Streak rule: miss one day and it resets to 0. Protection items coming later.</p></div><div class="card"><h3>Notifications</h3>${S.notes.slice(0,8).map(n=>`<p class="mu">• ${n}</p>`).join('')}</div>
<div class="card"><h3>Food Database API</h3><p class="mu">Food search uses the free USDA FoodData Central database — no backend needed. It runs on a shared demo key (30 searches/hour), so it can get rate-limited. <a href="https://fdc.nal.usda.gov/api-key-signup" target="_blank" style="color:var(--cy)">Get your own free key</a> (instant, no approval wait) and paste it below for reliable search.</p><input placeholder="Your USDA API key (optional)" value="${S.foodApiKey}" onchange="S.foodApiKey=this.value.trim();go('Settings')" style="width:100%;margin-top:8px"></div></div>`;
/* ---------- NAV ---------- */
const NAV=['Dashboard','Workout','Workout Progress','Stats','Calendar','Nutrition','Quests','Leaderboard','Achievements','Titles','Profile','Settings'];
function nav(){$('#side').innerHTML=NAV.map(n=>`<button class="${n==S.cur?'on':''}" onclick="go('${n}');menu(0)">${n}</button>`).join('');$('#mini').innerHTML=`${ttl()} ${S.name} • Lv ${S.lvl} • 🔥${S.streak} • PL ${PL().toLocaleString()}`}
function go(v){S.cur=v;fixStreak();chk();$('#app').innerHTML=V[v]();nav();scrollTo(0,0);tick()}
function menu(o){$('#side').classList.toggle('on',o);$('#side').classList.toggle('open',o);$('#veil').classList.toggle('on',o)}
$('#burger').onclick=()=>menu(!$('#side').classList.contains('open'));$('#veil').onclick=()=>menu(0);
res=FOODS.slice(0,1);S.setup?go('Dashboard'):go('Setup');setInterval(tick,1000);
</script></body></html>
